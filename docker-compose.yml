version: '3.9'

services:
  mysql_roles:
    image: mysql:8
    container_name: mysql_roles
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_ROLE}:3306"
    volumes:
      - db_roles:/var/lib/mysql
    networks:
      - roles-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  roles_service:
    build: ./roles
    container_name: roles_service
    restart: always
    working_dir: /app/roles
    ports:
      - "${PORT_ROLE_HOST}:${PORT_ROLE}"
    depends_on:
      mysql_roles:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME_ROLE}
      DB_PORT: ${DB_PORT}
      PORT: ${PORT_ROLE}
      API_KEY: ${API_KEY}
    networks:
      - roles-network

  permissions_service:
    build: ./permissions
    container_name: permissions_service
    restart: always
    working_dir: /app/permissions
    ports:
      - "${PORT_PERMISSION_HOST}:${PORT_PERMISSION}"
    depends_on:
      mysql_roles:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME_PERMISSION}
      DB_PORT: ${DB_PORT}
      PORT: ${PORT_PERMISSION}
      API_KEY: ${API_KEY}
    networks:
      - roles-network

volumes:
  db_roles:

networks:
  roles-network:
    driver: bridge
